spring.application.name=spoticlone-backend
server.port=8080

# ─── PostgreSQL ────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/spotyclone}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Deshabilitar auto-configuracion JPA / Hibernate explicitamente
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

# ─── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.connect-retries=3
spring.flyway.validate-on-migrate=true

# ─── MongoDB ───────────────────────────────────────────────────────────────────
spoticlone.mongodb.uri=${MONGO_URI:mongodb://localhost:27017}
spoticlone.mongodb.database=${MONGO_DB:spoticlone_nosql}

# ─── Logging ───────────────────────────────────────────────────────────────────
logging.level.unbosque.edu.co.Spoticlone=DEBUG
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.flywaydb=DEBUG

# ─── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=86400000
