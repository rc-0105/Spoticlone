spring.application.name=spoticlone-backend
server.port=8080

# ─── PostgreSQL ────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/spoticlone
spring.datasource.username=spoticlone_app
spring.datasource.password=TU_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

# Deshabilitar auto-configuracion JPA / Hibernate explicitamente
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

# ─── MongoDB ───────────────────────────────────────────────────────────────────
spoticlone.mongodb.uri=mongodb://localhost:27017
spoticlone.mongodb.database=spoticlone_nosql

# ─── Logging ───────────────────────────────────────────────────────────────────
logging.level.unbosque.edu.co.Spoticlone=DEBUG
logging.level.org.springframework.jdbc=DEBUG
